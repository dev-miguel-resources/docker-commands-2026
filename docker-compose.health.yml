# opcional, autogenerado
version: "3.8"

services:
  mysql-service:
    image: mysql:8
    container_name: mysqlserver
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - bdds-net
    volumes:
      - vol-bdd-mysql:/var/lib/mysql
    healthcheck:
      # test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD}"]
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${MYSQL_USER} -p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 20s
  
  postgres-service:
    image: postgres:15-alpine
    container_name: postgresdb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - bdds-net
    volumes:
      - vol-bdd-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  mongo-service:
    image: mongo:6
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    networks:
      - bdds-net
    volumes:
      - vol-bdd-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  app-backend:
    image: node:18-alpine
    container_name: backend-app-node
    working_dir: /app
    volumes:
      - ./:/app
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    networks:
      - bdds-net
    depends_on:
      mysql-service:
        condition: service_healthy
      postgres-service:
        condition: service_healthy
      mongo-service:
        condition: service_healthy
    
networks:
  bdds-net:
    name: bdds-net

volumes:
  vol-bdd-mysql:
    name: vol-bdd-mysql
  vol-bdd-postgres:
    name: vol-bdd-postgres
  vol-bdd-mongo:
    name: vol-bdd-mongo